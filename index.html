<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<style>
  :root { --bg:#fbf7f0; --text:#2a2522; --primary:#b5472f; --font:'Poppins',system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font); padding-bottom:90px; }
  header { padding:22px 18px 10px; display:flex; align-items:center; gap:14px; }
  header img { width:54px; height:54px; border-radius:12px; object-fit:cover; }
  header h1 { margin:0; font-size:22px; line-height:1.2; }
  .table { margin-left:auto; font-size:13px; padding:5px 11px; border-radius:99px; background:var(--primary); color:#fff; white-space:nowrap; }
  nav { position:sticky; top:0; z-index:10; background:var(--bg); display:flex; gap:8px; overflow-x:auto; padding:10px 18px; border-bottom:1px solid color-mix(in srgb, var(--text) 12%, transparent); }
  nav a { flex:none; text-decoration:none; color:var(--text); font-size:14px; font-weight:500; padding:7px 14px; border-radius:99px; border:1.5px solid var(--c, var(--primary)); }
  nav a:hover, nav a:focus-visible { background:var(--c, var(--primary)); color:#fff; outline:none; }
  section.menu { padding:22px 18px 26px; background:var(--mbg, transparent); scroll-margin-top:56px; }
  section.menu h2 { margin:0 0 16px; font-size:21px; color:var(--c); }
  .items { display:grid; gap:14px; }
  .grid .items { grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }
  .item { background:color-mix(in srgb, var(--text) 5%, var(--mbg, var(--bg))); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
  .item .ph { aspect-ratio:4/3; width:100%; object-fit:cover; background:color-mix(in srgb, var(--c) 18%, transparent); }
  .list .item { flex-direction:row; align-items:stretch; }
  .list .item .ph { width:96px; aspect-ratio:auto; flex:none; }
  .list .item.nophoto .ph { display:none; }
  .grid .item.nophoto .ph { display:none; }
  .item .body { padding:11px 12px 12px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .item b { font-size:15px; font-weight:600; }
  .item p { margin:0; font-size:12.5px; opacity:.7; line-height:1.4; }
  .item .foot { margin-top:auto; padding-top:8px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .price { font-weight:700; color:var(--c); }
  .qty { display:flex; align-items:center; gap:8px; }
  button { font:inherit; cursor:pointer; border:0; }
  .add { background:var(--c); color:#fff; padding:7px 14px; border-radius:99px; font-size:13px; font-weight:600; }
  .qty button { width:30px; height:30px; border-radius:50%; background:var(--c); color:#fff; font-size:17px; line-height:1; }
  .qty span { min-width:16px; text-align:center; font-weight:600; }
  .soldout { font-size:12px; opacity:.6; font-style:italic; }
  .item.off { opacity:.55; }
  .empty { padding:60px 24px; text-align:center; opacity:.6; }
  button:focus-visible { outline:3px solid var(--text); outline-offset:2px; }

  .bar { position:fixed; left:12px; right:12px; bottom:12px; background:var(--primary); color:#fff; border-radius:16px; padding:14px 18px; display:none; justify-content:space-between; align-items:center; font-weight:600; z-index:20; box-shadow:0 6px 22px rgba(0,0,0,.25); }
  .bar.show { display:flex; }
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-end; z-index:30; }
  .sheet-bg.open { display:flex; }
  .sheet { background:var(--bg); width:100%; max-height:88vh; overflow:auto; border-radius:20px 20px 0 0; padding:20px 18px 24px; }
  .sheet h3 { margin:0 0 12px; }
  .line { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid color-mix(in srgb, var(--text) 14%, transparent); }
  .line .qty button { background:var(--text); }
  .total { display:flex; justify-content:space-between; font-size:18px; font-weight:700; padding:14px 0; }
  textarea { width:100%; border:1px solid color-mix(in srgb, var(--text) 25%, transparent); border-radius:10px; padding:10px; font:inherit; background:transparent; color:var(--text); min-height:60px; }
  .send { width:100%; background:var(--primary); color:#fff; padding:14px; border-radius:12px; font-size:16px; font-weight:700; margin-top:10px; }
  .send:disabled { opacity:.5; }
  .status { margin:10px 18px 0; padding:12px 14px; border-radius:12px; background:color-mix(in srgb, var(--primary) 14%, var(--bg)); border:1.5px solid var(--primary); display:none; font-size:14px; }
  .status.show { display:block; }
  .status b { display:block; font-size:16px; margin-bottom:2px; }
  .status button { margin-top:8px; background:transparent; border:1px solid currentColor; color:inherit; padding:5px 12px; border-radius:99px; font-size:12px; }
  @media (prefers-reduced-motion:reduce){ html { scroll-behavior:auto; } }
</style>
</head>
<body>

<header>
  <img id="logo" alt="" style="display:none">
  <h1 id="name"></h1>
  <span class="table" id="table" style="display:none"></span>
</header>

<div class="status" id="status" role="status" aria-live="polite"></div>
<nav id="nav" aria-label="Menus"></nav>
<div id="menus"></div>

<div class="bar" id="bar"><span id="barCount"></span><button id="barBtn" style="background:#fff;color:var(--primary);padding:8px 16px;border-radius:99px;font-weight:700">Voir ma commande</button><span id="barTotal"></span></div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Ma commande">
    <h3>Ma commande</h3>
    <div id="lines"></div>
    <div class="total"><span>Total</span><span id="total"></span></div>
    <textarea id="note" placeholder="Remarque (ex: sans sucre)"></textarea>
    <button class="send" id="send">Envoyer la commande</button>
    <button id="close" style="background:none;width:100%;padding:12px;color:var(--text);opacity:.7">Continuer mes choix</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const TABLE = PARAMS.get('table') || '';
const LS_KEY = `lastOrder_${CAFE_ID}_${TABLE}`;
const state = { menus: [], plates: [], settings: { ...DEFAULT_SETTINGS }, cart: {} };

if (TABLE) { $('table').style.display = ''; $('table').textContent = 'Table ' + TABLE; }

// ---------- rendu ----------
function renderHeader() {
  const s = applyTheme(state.settings);
  $('name').textContent = s.name;
  document.title = s.name;
  $('logo').style.display = s.logo ? '' : 'none';
  if (s.logo) $('logo').src = s.logo;
}

function itemHTML(p) {
  const q = state.cart[p.id] || 0, off = p.available === false;
  return `<article class="item ${off ? 'off' : ''} ${p.photo ? '' : 'nophoto'}">
    ${p.photo ? `<img class="ph" src="${esc(p.photo)}" alt="" loading="lazy">` : ''}
    <div class="body">
      <b>${esc(p.name)}</b>
      ${p.desc ? `<p>${esc(p.desc)}</p>` : ''}
      <div class="foot">
        <span class="price">${money(p.price)}</span>
        ${off ? '<span class="soldout">Épuisé</span>'
          : q ? `<div class="qty"><button data-m="${p.id}" aria-label="Moins">−</button><span>${q}</span><button data-p="${p.id}" aria-label="Plus">+</button></div>`
          : `<button class="add" data-p="${p.id}">Ajouter</button>`}
      </div>
    </div>
  </article>`;
}

function renderMenus() {
  const shown = state.menus.filter(m => state.plates.some(p => p.menuId === m.id));
  document.body.classList.toggle('grid', state.settings.layout !== 'list');
  document.body.classList.toggle('list', state.settings.layout === 'list');
  if (!shown.length) {
    $('nav').innerHTML = '';
    $('menus').innerHTML = '<div class="empty">Le menu est vide pour le moment.</div>';
    return;
  }
  $('nav').innerHTML = shown.map(m => `<a href="#m-${m.id}" style="--c:${esc(m.accent || state.settings.primary)}">${esc(m.name)}</a>`).join('');
  $('menus').innerHTML = shown.map(m => {
    const plates = state.plates.filter(p => p.menuId === m.id).sort((a, b) => (a.order || 0) - (b.order || 0));
    return `<section class="menu" id="m-${m.id}" style="--c:${esc(m.accent || state.settings.primary)};${m.bg ? `--mbg:${esc(m.bg)};` : ''}">
      <h2>${esc(m.name)}</h2><div class="items">${plates.map(itemHTML).join('')}</div></section>`;
  }).join('');
}

// ---------- panier ----------
function cartLines() {
  return Object.entries(state.cart).map(([id, qty]) => ({ p: state.plates.find(x => x.id === id), qty })).filter(l => l.p && l.p.available !== false);
}
function renderCart() {
  const lines = cartLines();
  const count = lines.reduce((n, l) => n + l.qty, 0), total = lines.reduce((n, l) => n + l.qty * l.p.price, 0);
  $('bar').classList.toggle('show', count > 0);
  $('barCount').textContent = count + (count > 1 ? ' articles' : ' article');
  $('barTotal').textContent = money(total);
  $('total').textContent = money(total);
  $('lines').innerHTML = lines.map(l => `<div class="line"><div><b>${esc(l.p.name)}</b><br><small>${money(l.p.price)}</small></div>
    <div class="qty"><button data-m="${l.p.id}">−</button><span>${l.qty}</span><button data-p="${l.p.id}">+</button></div></div>`).join('');
  if (!count) $('sheetBg').classList.remove('open');
}
function change(id, d) {
  const n = (state.cart[id] || 0) + d;
  if (n <= 0) delete state.cart[id]; else state.cart[id] = n;
  renderMenus(); renderCart();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.p) change(b.dataset.p, 1);
  if (b.dataset.m) change(b.dataset.m, -1);
});
$('barBtn').onclick = () => $('sheetBg').classList.add('open');
$('close').onclick = () => $('sheetBg').classList.remove('open');
$('sheetBg').addEventListener('mousedown', e => { if (e.target === $('sheetBg')) $('sheetBg').classList.remove('open'); });

$('send').onclick = async () => {
  const lines = cartLines(); if (!lines.length) return;
  $('send').disabled = true;
  try {
    const order = {
      table: TABLE || '?',
      items: lines.map(l => ({ name: l.p.name, price: l.p.price, qty: l.qty })),
      total: lines.reduce((n, l) => n + l.qty * l.p.price, 0),
      note: $('note').value.trim(),
      status: 'new',
      createdAt: Date.now()
    };
    const id = await DB.add('orders', order);
    localStorage.setItem(LS_KEY, id);
    state.cart = {}; $('note').value = '';
    renderMenus(); renderCart(); watchOrder();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    alert('Erreur: la commande n\'a pas été envoyée. Réessayez.');
  } finally { $('send').disabled = false; }
};

// ---------- suivi de la commande ----------
let unwatch = null;
const LABELS = {
  new: ['Commande envoyée', 'En attente de confirmation par la cuisine.'],
  preparing: ['En préparation', 'Votre commande est en cours de préparation.'],
  ready: ['Prête !', 'Votre commande arrive à votre table.'],
  done: ['Servie', 'Bon appétit !'],
  cancelled: ['Commande annulée', 'Veuillez vous adresser au serveur.']
};
function watchOrder() {
  const id = localStorage.getItem(LS_KEY); if (!id) return;
  if (unwatch) unwatch();
  unwatch = DB.listenDoc('orders', id, o => {
    const box = $('status');
    if (!o || o.status === 'done') { box.classList.remove('show'); if (o) localStorage.removeItem(LS_KEY); return; }
    const [t, d] = LABELS[o.status] || LABELS.new;
    box.innerHTML = `<b>${t}</b>${d}`;
    box.classList.add('show');
  });
}

// ---------- data ----------
DB.listen('settings', a => { state.settings = { ...DEFAULT_SETTINGS, ...(a.find(x => x.id === 'site') || {}) }; renderHeader(); renderMenus(); });
DB.listen('menus', a => { state.menus = a.sort((x, y) => (x.order || 0) - (y.order || 0)); renderMenus(); });
DB.listen('plates', a => { state.plates = a; renderMenus(); renderCart(); });
applyTheme(DEFAULT_SETTINGS);
watchOrder();
</script>
</body>
</html>
